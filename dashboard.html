<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#0B63F6;--blue-600:#0A53D1;--navy:#061B4A;--ink:#0C1B3A;--text:#1F2D4D;--muted:#5B6B8C;--line:#E3EAF6;--bg:#fff;--soft:#F4F8FF;--soft2:#EAF2FF;--ok:#0E9F6E;--warn:#D97706;--bad:#E5484D;--r:16px;--sh:0 8px 30px rgba(11,99,246,.10);--sh2:0 2px 8px rgba(6,27,74,.06);--fd:'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--fb:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font-family:var(--fb);color:var(--text);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fd);color:var(--ink);line-height:1.15;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;cursor:pointer;transition:.18s;white-space:nowrap}
.btn:hover{border-color:#b9cdf5;transform:translateY(-1px)}
.btn.p{background:linear-gradient(135deg,#1F7BFF,var(--blue-600));border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(11,99,246,.28)}
.btn.p:hover{box-shadow:0 12px 26px rgba(11,99,246,.36)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn.lg{padding:15px 28px;font-size:16px;border-radius:14px}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:800;font-size:22px;color:var(--navy);letter-spacing:-.03em}
.logo img{width:38px;height:38px;border-radius:10px}.logo b{color:var(--blue)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid rgba(11,99,246,.35);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

body{background:var(--soft);min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:250px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;z-index:40;transition:transform .25s}
.side .logo{padding:4px 8px 18px}
.side nav{display:grid;gap:3px;flex:1;align-content:start;overflow:auto}
.side nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:500;font-size:15px;color:var(--muted);cursor:pointer;transition:.15s}
.side nav a:hover{background:var(--soft);color:var(--blue)}.side nav a.on{background:linear-gradient(135deg,#1F7BFF,#0A4BCB);color:#fff;box-shadow:0 8px 18px rgba(11,99,246,.28)}
.side nav .cnt{margin-left:auto;font-size:12px;background:var(--soft2);color:var(--blue-600);padding:1px 8px;border-radius:99px}.side nav a.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.me{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:var(--soft);width:100%;text-align:left}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1F7BFF,#0A4BCB);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--fd);flex:none}
.me b{display:block;font-size:14px;color:var(--ink)}.me small{color:var(--muted)}
.top{display:none;position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;justify-content:space-between}
.top button{background:none;border:0;padding:6px;cursor:pointer}
.scrim{display:none;position:fixed;inset:0;background:rgba(6,27,74,.4);z-index:35}
main{margin-left:250px;padding:30px 34px 60px;max-width:1400px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.vh h1{font-size:28px;font-weight:800}.vh p{color:var(--muted);margin-top:4px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sel,.in{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px;min-width:0}
.sel:focus,.in:focus{border-color:var(--blue);outline:3px solid rgba(11,99,246,.15)}
.sw{position:relative}.sw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}.sw .in{padding-left:38px;width:240px}
.grid{display:grid;gap:16px}.st4{grid-template-columns:repeat(4,1fr)}.st5{grid-template-columns:repeat(5,1fr)}.two{grid-template-columns:1.4fr 1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh2)}
.card h3{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.stat{display:flex;gap:14px;align-items:center}.stat .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--soft2);color:var(--blue);flex:none}
.stat small{color:var(--muted);font-size:13px;display:block}.stat b{font-family:var(--fd);font-size:22px;color:var(--ink);letter-spacing:-.02em}
.stat.g .ic{background:#E5F7EF;color:var(--ok)}.stat.o .ic{background:#FEF1DC;color:var(--warn)}.stat.r .ic{background:#FDEAEA;color:var(--bad)}
.hi{background:linear-gradient(135deg,#1F7BFF,#0A3FB5);color:#fff;border:0}.hi small{color:#cfe0ff}.hi b{color:#fff}.hi .ic{background:rgba(255,255,255,.2);color:#fff}
.combo{display:grid;grid-template-columns:repeat(5,1fr);padding:0}.combo>div{padding:18px 20px;border-right:1px solid var(--line)}.combo>div:last-child{border:0}.combo small{color:var(--muted);font-size:13px}.combo b{display:block;font-family:var(--fd);font-size:26px;color:var(--ink)}
.list{display:grid;gap:10px}.li{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.li .m{flex:1;min-width:0}.li b{display:block;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li small{color:var(--muted);font-size:12.5px}
.dt{width:46px;text-align:center;background:var(--soft2);border-radius:10px;padding:4px 0;flex:none}.dt b{font-size:17px;font-family:var(--fd);color:var(--blue-600)}.dt small{display:block;text-transform:uppercase;font-size:10.5px;font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft2);color:var(--blue-600)}
.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:14px}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.qa button{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-weight:600;font-size:14px;transition:.15s}.qa button:hover{border-color:#b9cdf5;background:var(--soft)}.qa svg{color:var(--blue)}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}.chart>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}.chart i{width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:linear-gradient(#5AA0FF,#0B63F6);min-height:3px}.chart small{font-size:12px;color:var(--muted)}
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:0 0 290px;border-radius:16px;padding:12px;scroll-snap-align:start;border:1px solid rgba(6,27,74,.06)}.col.over{outline:2px dashed var(--blue)}
.col h4{font-size:14px;display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px}.col h4 span{background:rgba(255,255,255,.75);border-radius:99px;font-size:12px;padding:1px 9px;font-family:var(--fb);font-weight:600}
.k{background:#fff;border-radius:12px;padding:13px;margin-bottom:10px;box-shadow:var(--sh2);cursor:grab;border:1px solid transparent;transition:.15s}.k:hover{border-color:#b9cdf5}.k.drag{opacity:.4}
.k b{font-size:14px;color:var(--ink);display:block}.k p{font-size:13px;color:var(--muted);margin:4px 0 8px;display:-webkit-box;--webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.k .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}.k .row select{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:120px}
.k .x{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px;border-radius:8px}.k .x:hover{background:#FDEAEA;color:var(--bad)}
.bar{height:6px;background:var(--soft2);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5AA0FF,#0B63F6)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:6px 0}
.cd{min-height:92px;border:1px solid var(--line);border-radius:12px;padding:6px;background:#fff;cursor:pointer;overflow:hidden;transition:.15s}.cd:hover{border-color:#9dbcf7;background:var(--soft)}.cd.o{background:#F8FAFE;opacity:.6}.cd.t{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cd>span{font-size:12.5px;font-weight:600;color:var(--ink)}.ev{display:block;font-size:11.5px;background:var(--soft2);color:var(--blue-600);border-radius:6px;padding:2px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}.seg button.on{background:var(--blue);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}.tw{overflow-x:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tc{display:flex;flex-direction:column;gap:12px;transition:.2s}.tc:hover{transform:translateY(-3px);box-shadow:var(--sh)}.tc .hd{display:flex;gap:12px;align-items:center}.tc .lt{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);box-shadow:var(--sh2);flex:none;transition:.25s;overflow:hidden}.tc:hover .lt{transform:scale(1.08) rotate(-4deg);box-shadow:var(--sh)}.tc .lt img{width:32px;height:32px;object-fit:contain}.tc .lt.fb{background:var(--soft2);color:var(--blue);font-family:var(--fd);font-weight:800;font-size:20px}.tc .lt.fb::after{content:attr(data-l)}
.tc p{font-size:13.5px;color:var(--muted);flex:1}.tc .bt{display:flex;gap:8px}.tc .bt .btn{flex:1}
.th{height:140px;border-radius:12px;display:grid;place-items:center;position:relative;overflow:hidden;color:#fff}.th::after{content:"";position:absolute;width:150px;height:150px;border:26px solid rgba(255,255,255,.12);border-radius:50%;right:-40px;top:-50px}
.th span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:var(--blue);box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:1}.th span svg{fill:currentColor;stroke:none;width:22px;height:22px;margin-left:3px}
.md{position:fixed;inset:0;background:rgba(6,27,74,.45);display:grid;place-items:center;z-index:100;padding:16px;animation:fi .18s}
.mb{background:#fff;border-radius:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(6,27,74,.35);animation:up .22s}
@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(14px);opacity:0}}
.mb h3{font-size:20px;margin-bottom:16px;display:flex;justify-content:space-between}.mb h3 button{background:none;border:0;cursor:pointer;color:var(--muted)}
.f{display:grid;gap:6px;margin-bottom:14px}.f label{font-size:13px;font-weight:600;color:var(--ink)}.f .in,.f .sel,.f textarea{width:100%}.f textarea{padding:10px 14px;border:1px solid var(--line);border-radius:12px;min-height:80px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ft{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.sr{display:flex;gap:8px;align-items:center;margin-bottom:8px}.sr input[type=color]{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff;cursor:pointer}.sr .in{flex:1}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:200;box-shadow:0 12px 30px rgba(6,27,74,.4);animation:up .25s}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px}
@media(max-width:1100px){.st5,.combo{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}

@media(max-width:480px){.st4{grid-template-columns:1fr}.f2{grid-template-columns:1fr}.vh h1{font-size:23px}}

#fab.o .fm{pointer-events:auto}#fab.o .fm button{opacity:1;transform:none}

<main id="app"></main>
<script>
var K='venxora:v1',$=function(s,r){return(r||document).querySelector(s)};
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ico(n){return '<svg class="i"><use href="#'+n+'"/></svg>'}
var COL=['#E3EEFF','#E0F6EC','#FFF1D6','#FDE4E4','#EDE5FF','#DDF4F7','#FDE6F1','#EAF0D8'];
function defStages(){return[{id:'new',name:'New Task',color:COL[0]},{id:'progress',name:'In Progress',color:COL[2]},{id:'done',name:'Complete',color:COL[1]},{id:'cancel',name:'Cancelled',color:COL[3]}]}
function fresh(){var p=defStages();p[0].name='New Project';return{name:'',stages:{tasks:defStages(),projects:p},tasks:[],projects:[],events:[],campaigns:[],tx:[],trash:[],members:[],notes:[],links:[],files:[],goals:[]}}
var S=load();
function load(){try{var r=JSON.parse(localStorage.getItem(K));if(r&&r.stages){['tasks','projects','events','campaigns','tx','trash','members','notes','links','files','goals'].forEach(function(k){if(!r[k])r[k]=[]});return r}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){return false}}
var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var now=new Date(),sel={y:now.getFullYear(),m:now.getMonth()},cal={y:now.getFullYear(),m:now.getMonth(),mode:'month'},q={tasks:'',projects:''},view='dashboard';
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ym(s){return s?[+s.slice(0,4),+s.slice(5,7)-1]:[0,0]}
function inSel(s){var a=ym(s);return a[0]==sel.y&&a[1]==sel.m}
function money(n){return '₹'+Math.round(n||0).toLocaleString('en-IN')}
function fdate(s){if(!s)return'—';var d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}
function sid(kind,name){var s=S.stages[kind].filter(function(x){return x.name==name})[0];return s&&s.id}

/* modal */
function modal(title,body,onOk,okText,cancel){
  var m=document.createElement('div');m.className='md';
  m.innerHTML='<div class="mb" role="dialog" aria-modal="true"><h3>'+esc(title)+'<button type="button" aria-label="Close">'+ico('x')+'</button></h3><form novalidate>'+body+(okText===false?'':'<div class="ft"><button type="button" class="btn" data-c>Cancel</button><button class="btn p">'+(okText||'Save')+'</button></div>')+'</form></div>';
  document.body.appendChild(m);
  function close(){m.remove();document.removeEventListener('keydown',kd)}
  function kd(e){if(e.key==='Escape')close()}document.addEventListener('keydown',kd);
  m.onclick=function(e){if(e.target===m)close()};
  $('h3 button',m).onclick=close;var c=$('[data-c]',m);if(c)c.onclick=close;
  $('form',m).onsubmit=function(e){e.preventDefault();var f=e.target,d={},ok=true;
    f.querySelectorAll('[name]').forEach(function(el){d[el.name]=el.value.trim();if(el.required&&!el.value.trim()){ok=false;el.style.borderColor='#E5484D'}else el.style.borderColor=''});
    if(!ok)return;if(onOk&&onOk(d)!==false)close()};
  var fi=$('input,select,textarea',m);if(fi)fi.focus();return{el:m,close:close};
}
function fld(n,l,o){o=o||{};var t=o.t||'text',v=o.v==null?'':o.v,r=o.req?' required':'',inner;
  if(t=='select')inner='<select class="sel" name="'+n+'"'+r+'>'+o.opts.map(function(p){var a=Array.isArray(p)?p:[p,p];return'<option value="'+esc(a[0])+'"'+(a[0]==v?' selected':'')+'>'+esc(a[1])+'</option>'}).join('')+'</select>';
  else if(t=='textarea')inner='<textarea name="'+n+'"'+r+' placeholder="'+esc(o.ph||'')+'">'+esc(v)+'</textarea>';
  else inner='<input class="in" type="'+t+'" name="'+n+'" value="'+esc(v)+'"'+r+(o.min!=null?' min="'+o.min+'"':'')+' placeholder="'+esc(o.ph||'')+'">';
  return'<div class="f"><label>'+l+(o.req?' *':'')+'</label>'+inner+'</div>'}
function csv(name,rows){var t=rows.map(function(r){return r.map(function(c){return'"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Downloaded '+name)}

function fin(){var r=0,rc=0,ex=0,acc=0,end=new Date(sel.y,sel.m+1,0);
  S.projects.forEach(function(p){if(inSel(p.start)){r+=+p.budget||0;rc+=+p.paid||0}});
  S.tx.forEach(function(t){var a=+t.amount||0;if(inSel(t.date)){if(t.type=='revenue')r+=a;if(t.type=='received')rc+=a;if(t.type=='expense')ex+=a}});
  S.projects.forEach(function(p){if(p.start&&new Date(p.start+'T00:00:00')<=end)acc+=+p.paid||0});
  S.tx.forEach(function(t){if(t.date&&new Date(t.date+'T00:00:00')<=end){if(t.type=='received')acc+=+t.amount||0;if(t.type=='expense')acc-=+t.amount||0}});
  return{r:r,rc:rc,ex:ex,acc:acc}}

function pickFiles(fl){var added=[],pend=0,bad=0;Array.prototype.forEach.call(fl,function(f){if(f.size>400*1024){bad++;return}pend++;var r=new FileReader();r.onload=function(){added.push({id:uid(),name:f.name,size:f.size,data:r.result,at:iso(new Date())});fin2()};r.onerror=function(){fin2()};r.readAsDataURL(f)});

  if(wt=='notes'){var N=S.notes.slice().sort(function(a,b){return(b.pin-a.pin)||(a.at<b.at?1:-1)});b='<div class="tools">'+(N.length?N.map(function(n){return'<div class="card tc" data-n="'+n.id+'" style="background:'+COL[NCI[n.color]||0]+';cursor:pointer"><div style="display:flex;justify-content:space-between;gap:8px"><b style="color:var(--ink)">'+esc(n.title)+'</b><button class="x" data-pn="'+n.id+'" aria-label="Pin" style="background:none;border:0;cursor:pointer;font-size:16px;opacity:'+(n.pin?1:.35)+'">📌</button></div><p style="white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;color:var(--text)">'+esc(n.body)+'</p><div style="display:flex;justify-content:space-between;align-items:center"><small style="color:var(--muted)">'+fdate(n.at)+'</small><button class="btn sm" data-dn="'+n.id+'" aria-label="Delete">'+ico('trash')+'</button></div></div>'}).join(''):'<div class="card empty" style="grid-column:1/-1">No notes yet. Capture ideas, meeting notes and reminders.</div>')+'</div>'}
  if(wt=='files')b='<div class="card"><div class="list">'+(S.files.length?S.files.map(function(f){return'<div class="li"><span class="ic" style="width:40px;height:40px;border-radius:12px;background:var(--soft2);color:var(--blue);display:grid;place-items:center;flex:none">'+ico('file')+'</span><div class="m"><b>'+esc(f.name)+'</b><small>'+fsize(f.size)+' · added '+fdate(f.at)+'</small></div><a class="btn sm" download="'+esc(f.name)+'" href="'+f.data+'">'+ico('down')+'Download</a><button class="btn sm" data-df="'+f.id+'" aria-label="Delete">'+ico('trash')+'</button></div>'}).join(''):'<div class="empty">No files yet. Upload small files (up to 400 KB each) to keep them handy.</div>')+'</div><p class="hint">Files are stored privately in this browser only.</p></div>';
  if(wt=='links')b='<div class="tools">'+(S.links.length?S.links.map(function(l){var hs='';try{hs=new URL(l.url).hostname}catch(e){}return'<div class="card tc" style="flex-direction:row;align-items:center;gap:12px"><a href="'+esc(l.url)+'" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0"><span class="lt" data-l="'+esc((l.name||'?').charAt(0).toUpperCase())+'"><img src="https://www.google.com/s2/favicons?domain='+esc(hs)+'&sz=128" alt="" onerror="this.parentNode.classList.add(\'fb\');this.remove()"></span><b style="color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(l.name)+'</b></a><button class="btn sm" data-dl="'+l.id+'" aria-label="Remove">'+ico('x')+'</button></div>'}).join(''):'<div class="card empty" style="grid-column:1/-1">Add links to the websites and tools you use every day.</div>')+'</div>';

var gq='';
function hl(s,q){s=String(s==null?'':s);var i=s.toLowerCase().indexOf(q);return i<0?esc(s):esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length))}
function stN(kind,id){return(S.stages[kind].filter(function(s){return s.id==id})[0]||{}).name||''}
function searchRes(){var q=gq.trim().toLowerCase();if(!q)return'<div class="empty">Start typing to search your tasks, projects, meetings, notes and more.<br><small>Tip: press Ctrl/⌘ + K or “/” from anywhere.</small></div>';
  function has(){return Array.prototype.slice.call(arguments).join(' ').toLowerCase().indexOf(q)>-1}
  var G=[['Tasks','tasks',S.tasks.filter(function(t){return has(t.title,t.desc)}).map(function(t){return[t.title,stN('tasks',t.stage)+(t.due?' · Due '+fdate(t.due):''),'tasks',t.id]})],
  ['Projects','projects',S.projects.filter(function(p){return has(p.name,p.desc,p.client,p.type)}).map(function(p){return[p.name,[p.client,p.type,stN('projects',p.stage)].filter(Boolean).join(' · '),'projects',p.id]})],
  ['Meetings','meetings',S.events.filter(function(e){return has(e.title,e.desc)}).map(function(e){return[e.title,fdate(e.date)+' · '+e.time,'event',e.id]})],
  ['Notes','workspace',S.notes.filter(function(n){return has(n.title,n.body)}).map(function(n){return[n.title,(n.body||'').slice(0,80),'note',n.id]})],
  ['Goals','goals',S.goals.filter(function(g){return has(g.title)}).map(function(g){return[g.title,gp(g)+'% · '+g.type,'goals',g.id]})],
  ['Team','team',S.members.filter(function(m){return has(m.name,m.role,m.email)}).map(function(m){return[m.name,m.role||m.email||'','team',m.id]})],
  ['Campaigns','marketing',S.campaigns.filter(function(c){return has(c.name,c.channel)}).map(function(c){return[c.name,c.channel+' · '+c.status,'marketing',c.id]})]];
  var n=0,out=G.filter(function(g){return g[2].length}).map(function(g){n+=g[2].length;return'<div class="card" style="margin-bottom:14px"><h3>'+g[0]+' <span class="tag">'+g[2].length+'</span></h3><div class="list">'+g[2].map(function(r){return'<div class="li" style="cursor:pointer" data-g="'+r[2]+'" data-i="'+r[3]+'"><div class="m"><b>'+hl(r[0],q)+'</b><small>'+hl(r[1],q)+'</small></div>'+ico('chev')+'</div>'}).join('')+'</div></div>'}).join('');
  return n?out:'<div class="empty">No results for “'+esc(gq)+'”.</div>'}

(function(){var QA=[['New task','check',function(){newTask()}],['New project','folder',function(){newProject()}],['New meeting','cal',function(){newEvent()}],['New note','note',function(){newNote()}],['New goal','target',function(){newGoal()}],['Add member','users',function(){newMember()}],['Search','search',function(){location.hash='search'}]];
  var f=document.createElement('div');f.id='fab';f.innerHTML='<div class="fm">'+QA.map(function(a,i){return'<button style="--d:'+(QA.length-i)*28+'ms">'+ico(a[1])+a[0]+'</button>'}).join('')+'</div><button class="fb" aria-label="Quick actions" aria-expanded="false">'+ico('plus')+'</button>';document.body.appendChild(f);
